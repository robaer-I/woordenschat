<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mijn Woordenschat</title>
<meta name="theme-color" content="#2f4bd6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Woordenschat">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f5f6f9; --surface:#ffffff; --sunk:#eceef4; --fg:#1b1f2c; --muted:#5f6679; --line:#d9dce6;
  --accent:#2f4bd6; --accent-fg:#ffffff; --ok:#1d7a4c; --ok-bg:#e1f3e9; --danger:#c22f2f;
  --mark:#ffe27a; --mark-fg:#1b1f2c; --lang:var(--accent);
  --f-display:"Segoe UI Variable Display","SF Pro Display",system-ui,-apple-system,"Roboto",sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI","Roboto",sans-serif;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#12141b; --surface:#1b1e28; --sunk:#232735; --fg:#e8eaf2; --muted:#9aa1b5; --line:#2f3444;
  --accent:#8ea0ff; --accent-fg:#10131c; --ok:#6fd3a0; --ok-bg:#183327; --danger:#ff8a8a;
  --mark:#6b5a12; --mark-fg:#fff6cf; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 90px}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:32px;font-weight:800;letter-spacing:-.02em}
h2{font-size:22px;font-weight:800}
.sub{color:var(--muted);margin:4px 0 0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button.danger{background:var(--danger);border-color:var(--danger);color:#fff}
button.ghost{background:transparent;border-color:transparent}
button:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=text]{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;font-size:18px}
input[type=text]:focus{border-color:var(--lang);outline:none}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.note{padding:10px 14px;border-radius:10px;background:var(--sunk);color:var(--muted);margin:12px 0}
.langs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:20px 0}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:16px 16px 16px 20px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);min-height:110px;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--c)}
.tile .nm{font-family:var(--f-display);font-size:22px;font-weight:800}
.tile .ct{color:var(--muted);font-variant-numeric:tabular-nums}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2 input{flex:1 1 180px}
.section{margin-top:28px;display:grid;gap:10px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top h2{flex:1 1 auto;display:flex;align-items:center;gap:10px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--lang);flex:none}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.actions button{padding:8px 12px;min-height:40px;font-size:15px}
.search{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:12px 6px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fields label{display:flex;flex-direction:column;gap:4px;min-width:0}
.status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:44px;margin-top:6px;color:var(--muted);font-size:15px}
.statusrow{display:flex;align-items:flex-start;gap:8px}
.statusrow .status{flex:1 1 auto;min-width:0}
button.clear{flex:none;margin-top:6px;padding:8px 12px;min-height:44px;color:var(--muted)}
.status.exists{color:var(--ok)} .status.new{color:var(--fg)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--ok-bg);color:var(--ok)}
.head{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 12px}
.head button{border:0;background:none;padding:0;min-height:0;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.head button.on{color:var(--fg)}
.count{color:var(--muted);font-size:14px;margin:8px 0 2px;font-variant-numeric:tabular-nums}
ul.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:11px 12px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:active,.row.hi{background:var(--sunk)}
.row .f{font-weight:600;min-width:0;overflow-wrap:anywhere} .row .d{min-width:0;overflow-wrap:anywhere}
.row.exact{box-shadow:inset 4px 0 0 var(--ok)}
.more{padding:12px;text-align:center;color:var(--muted);border-top:1px solid var(--line)}
mark{background:var(--mark);color:var(--mark-fg);border-radius:3px;padding:0 1px}
.edit{padding:12px;border-top:1px solid var(--line);background:var(--sunk);display:grid;gap:10px}
.edit input[type=text]{font-size:16px;padding:10px 12px}
.edit .btns{display:flex;gap:8px;flex-wrap:wrap} .edit .sp{flex:1}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(10,12,20,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dialog{background:var(--surface);border-radius:16px;padding:20px;max-width:460px;width:100%;display:grid;gap:12px;border:1px solid var(--line);max-height:90vh;overflow:auto}
.dialog p{margin:0}
.dialog .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dialog select,.dialog input[type=file]{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden} .bar i{display:block;height:100%;background:var(--accent);width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;display:flex;gap:12px;align-items:center;z-index:30;max-width:calc(100% - 32px)}
.toast button{background:transparent;color:var(--bg);border-color:var(--muted);padding:4px 10px;min-height:36px}
.ver{position:fixed;z-index:15;top:calc(6px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));
  font-size:12px;color:var(--muted);background:var(--bg);padding:2px 8px;border-radius:99px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.ver.new{color:var(--fg);border-color:var(--accent);display:flex;align-items:center;gap:8px;padding:4px 6px 4px 10px;font-size:13px}
.ver.new button{min-height:32px;padding:4px 10px;background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.wrap>h1,.top{padding-right:84px}
.foot{margin-top:32px;color:var(--muted);font-size:13px}
@media (max-width:520px){.fields{grid-template-columns:1fr}.edit .fields{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="note">Laden…</p></div>
<div id="layer"></div>
<script src="jspdf.umd.min.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
